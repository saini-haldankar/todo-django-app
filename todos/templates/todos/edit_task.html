<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen">

    <div class="max-w-xl mx-auto px-4 py-16">

        <div class="bg-white rounded-3xl shadow-2xl p-8">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
                Edit Task ✏️
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Update your task below
            </p>

            <form method="POST">
                {% csrf_token %}

                <input
                    type="text"
                    name="title"
                    value="{{ task.title }}"
                    class="w-full px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-5"
                    required
                >

                <div class="flex gap-3">

                    <button
                        type="submit"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'task_list' %}"
                        class="flex-1 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-xl transition"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
